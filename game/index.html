<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>The Gilded Hour — a museum heist</title>
<style>
  :root {
    --navy: #0d1330;
    --navy-deep: #070b20;
    --gold: #d9a83f;
    --gold-bright: #f4cd6a;
    --cream: #f2e7c9;
    --alarm: #e33f2f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--navy-deep);
    color: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px 0 16px;
  }
  #stage { position: relative; width: 1280px; height: 800px; }
  canvas {
    display: block;
    background: var(--navy);
    border: 2px solid var(--gold);
    box-shadow: 0 0 44px rgba(0, 0, 0, 0.75), 0 0 12px rgba(217, 168, 63, 0.35);
  }
  /* ---------- HUD ---------- */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 10px 16px;
    pointer-events: none;
    text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,0.9);
  }
  #levelBox { min-width: 250px; }
  #levelName { font-size: 21px; letter-spacing: 1px; color: var(--gold-bright); }
  #objective { font-size: 13px; font-style: italic; opacity: 0.9; margin-top: 2px; }
  #alarmBox { width: 430px; text-align: center; }
  #alarmLabel {
    font-size: 14px; letter-spacing: 5px; color: var(--cream);
  }
  #alarmBar {
    margin-top: 4px;
    height: 20px;
    border: 2px solid var(--gold);
    background: rgba(5, 8, 22, 0.82);
    border-radius: 3px;
    overflow: hidden;
  }
  #alarmFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7a4d12, var(--gold), #e07b2f, var(--alarm));
    transition: width 90ms linear;
  }
  #scoreBox { min-width: 250px; text-align: right; font-size: 17px; }
  #scoreBox .big { font-size: 22px; color: var(--gold-bright); }
  #pouch {
    position: absolute;
    left: 16px; bottom: 12px;
    display: flex; gap: 18px;
    font-size: 16px;
    text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,0.9);
    pointer-events: none;
  }
  #pouch .tool b { color: var(--gold-bright); font-size: 19px; }
  #hint {
    position: absolute;
    right: 16px; bottom: 12px;
    font-size: 12.5px; font-style: italic; text-align: right;
    opacity: 0.85;
    text-shadow: 0 1px 3px #000;
    pointer-events: none;
  }
  /* ---------- Banner (caught / level clear / win) ---------- */
  #banner {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(4, 6, 16, 0.72);
    text-align: center;
  }
  #banner.show { display: flex; }
  #bannerTitle {
    font-size: 54px;
    letter-spacing: 4px;
    color: var(--gold-bright);
    text-shadow: 0 0 26px rgba(217, 168, 63, 0.55), 0 2px 4px #000;
  }
  #banner.caught #bannerTitle { color: #ff6a55; text-shadow: 0 0 26px rgba(227, 63, 47, 0.6), 0 2px 4px #000; }
  #bannerText { margin-top: 12px; font-size: 19px; line-height: 1.55; max-width: 640px; }
  #bannerKey { margin-top: 18px; font-size: 15px; font-style: italic; opacity: 0.9; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="800"></canvas>

    <div id="hud">
      <div id="levelBox">
        <div id="levelName">The Scarab Hall</div>
        <div id="objective">Take the Gilded Scarab, then reach the van.</div>
      </div>
      <div id="alarmBox">
        <div id="alarmLabel">— ALARM —</div>
        <div id="alarmBar"><div id="alarmFill"></div></div>
      </div>
      <div id="scoreBox">
        <div>LOOT&nbsp; <span class="big" id="score">0</span></div>
        <div>TIME&nbsp; <span id="timer">0:00</span></div>
      </div>
    </div>

    <div id="pouch">
      <div class="tool">🪙 Decoy coins <b id="coins">0</b> <span>(click to throw)</span></div>
      <div class="tool">⚡ EMP charges <b id="emps">0</b> <span>(E)</span></div>
    </div>
    <div id="hint">WASD / arrows move · Shift sneak · Click throw coin · E EMP · R restart</div>

    <div id="banner">
      <div id="bannerTitle"></div>
      <div id="bannerText"></div>
      <div id="bannerKey"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
